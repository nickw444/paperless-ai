# Example metadata guidance for paperless-ai prompts.
# Copy to metadata_guidance.yaml and customize for your Paperless instance.
#
# Only tags and document types listed here can be suggested by the agent.

tags:
  Example Tag:
    use_when: When the document clearly matches this tag.
    avoid_when: When the tag would only apply incidentally.

document_types:
  Example Type:
    use_when: When the document fits this category.
    avoid_when: When another document type is a better fit.
